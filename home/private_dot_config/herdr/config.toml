onboarding = false

[keys]
prefix = "ctrl+a"

# Splits: herdr's "vertical" means side-by-side, so it maps to tmux's `|`
split_vertical = 'prefix+|'
split_horizontal = 'prefix+\'

# Bare ctrl+hjkl is handled by the vim-herdr-navigation plugin below, which
# forwards to vim when a pane is running it. These stay as the way out of a
# TUI that owns ctrl+hjkl itself.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# tmux binds r to reload; resize_mode moves off prefix+r to make room
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

zoom = ["prefix+m", "prefix+z"]
detach = "prefix+d"

toggle_sidebar = "prefix+tab"
switch_workspace = "prefix+shift+1..9"

# tmux: prefix+, renames window, prefix+s picks session
rename_tab = "prefix+comma"
goto = ["prefix+s", "prefix+g"]
workspace_picker = "prefix+w"
settings = "prefix+shift+comma"

[[keys.command]]
key = "prefix+shift+p"
type = "popup"
command = "$SHELL"
width = "80%"
height = "80%"
description = "scratch terminal"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[ui]
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"

[theme]
name = "terminal"
auto_switch = false

[experimental]
pane_history = false
switch_ascii_input_source_in_prefix = false
