set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc:RGB"
set -ga terminal-overrides ",*:Smulx=\\E[4::%p1%dm"
set -ga terminal-overrides ",*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"
set -ga terminal-overrides ",*:Ss=\\E[%p1%d q:Se=\\E[2 q"

set -sg escape-time 10
set -g history-limit 50000
set -g display-time 4000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g mode-keys vi

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Splits
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -v -c "#{pane_current_path}"

# Resize
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5

# Maximize
bind -r m resize-pane -Z

# Detach
bind d detach-client

# Last window
bind Tab last-window

# Window swapping
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Popup scratch terminal
bind p display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# Vi copy mode with clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Vim-tmux navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'erikw/tmux-dark-notify'
set -g @plugin 'joshmedeski/t-smart-tmux-session-manager'
set -g @plugin 'Morantron/tmux-fingers'

set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-processes 'nvim vim vi ~Grep'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

set -g @online_icon "ok"
set -g @offline_icon "nok"

set -g @dark-notify-theme-path-dark "$HOME/.config/tmux/theme-dark.conf"
set -g @dark-notify-theme-path-light "$HOME/.config/tmux/theme-light.conf"

set -g @fingers-key F

# Layout
set -g status-position top
set -g status-justify "absolute-centre"
set -g status-interval 5
set -wg automatic-rename on
set -g automatic-rename-format "Window"
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-border-lines single

# Status bar format strings (must be before `run tpm` so TPM can interpolate plugin variables)
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold] 󰀵 #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}] 󰀵 #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{b:pane_current_path}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red}#,bold]#[reverse] 󰖪 off }"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,}#(~/.config/tmux/check-listening.sh #{pane_pid})#(~/.config/tmux/check-claude.sh #{pane_id}) "
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,}#(~/.config/tmux/check-listening.sh #{pane_pid})#(~/.config/tmux/check-claude.sh #{pane_id}) "

# Bootstrap TPM
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'

# Style options with -gF (must be after `run tpm` so @thm_* variables from catppuccin are available)
source-file ~/.config/tmux/styles.conf

# Apply correct theme on startup based on current macOS appearance
if-shell "defaults read -g AppleInterfaceStyle >/dev/null 2>&1" \
    "source-file ~/.config/tmux/theme-dark.conf" \
    "source-file ~/.config/tmux/theme-light.conf"

# Hooks
set-hook -g pane-exited "run-shell 'rm -f /tmp/tmux-listening-cache/#{hook_pane_pid} 2>/dev/null'"
